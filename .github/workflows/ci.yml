name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Install uv
        run: python -m pip install uv
      - name: Bootstrap locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Run release checks
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/release-check --sha "$GITHUB_SHA" --skip-e2e
          else
            scripts/release-check --sha "$GITHUB_SHA"
          fi
