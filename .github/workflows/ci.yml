---
name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    # Candidate release qualification branches are listed here so pushing to
    # them triggers the certification chain (see core-release-certification
    # below); every privileged job keeps its push-to-main/tag-only guard.
    branches: [main, candidate/next-release, fix/pr6-safe-main-integration]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  # Candidate release qualification: the certification chain can be exercised
  # against any branch before merging to main. Dispatched runs are
  # nonpublishing by construction - every privileged job below keeps its
  # push-to-main/tag gate, so signing and publication stay unreachable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normal:
    # The native companion promises imported GLIBC symbols <= 2.34. Build it
    # on the compatible Ubuntu 22.04 baseline; sandbox preparation below is
    # still required for the generated-capability tests.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Prepare Bubblewrap sandbox
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap libx11-dev libxft-dev libgl1-mesa-dev

          # Bubblewrap needs unprivileged user namespaces.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          # Ubuntu 24.04+ AppArmor otherwise blocks Bubblewrap's network setup.
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          command -v bwrap
          bwrap --version
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-pid \
            --unshare-net \
            --proc /proc \
            --dev /dev \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            /usr/bin/true
      - name: Bootstrap locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Run ordinary CI checks
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          make check

      - name: Run Python formatting and critical static gates
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          make format-check static-critical

  full-python-3-12:
    # The complete suite must run on the same GLIBC baseline as the release
    # artifacts; sandboxed-execution and native seam tests are part of it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Install workspace sandbox and native-link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libx11-dev libxft-dev libgl1-mesa-dev
      - name: Prepare Bubblewrap sandbox
        run: |
          set -euo pipefail

          # Bubblewrap needs unprivileged user namespaces.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          # Ubuntu 24.04+ AppArmor otherwise blocks Bubblewrap's network setup.
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          command -v bwrap
          bwrap --version
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-pid \
            --unshare-net \
            --proc /proc \
            --dev /dev \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            /usr/bin/true
      - name: Bootstrap locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Provision pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4
      - name: Bootstrap pinned release toolchain
        # The release-script tests execute the same provisioned-toolchain
        # contract release-check satisfies on a developer checkout.
        run: |
          set -euo pipefail
          mkdir -p .release-toolchain/bin
          cp "$(command -v cosign)" .release-toolchain/bin/cosign
          .release-toolchain/bin/cosign version
          scripts/bootstrap-cargo-deny
      - name: Build native binary for projection tests
        run: cargo build --manifest-path native/Cargo.toml --locked --offline
      - name: Run the complete Python suite on Python 3.12
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          uv run --frozen --extra dev --extra anthropic --extra mcp python -m pytest -q

  critical-contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Install workspace sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Run critical correctness contracts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          make critical-contracts

  native:
    # Build the native companion on the same GLIBC-compatible baseline as the
    # release artifact policy.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libfontconfig1-dev libgl1-mesa-dev libx11-dev libxft-dev libxrender-dev
      - name: Install uv
        run: python3 -m pip install uv==0.11.21
      - name: Bootstrap locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Run Rust Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --locked --offline -- -D warnings
      - name: Build native production binary
        run: cargo build --manifest-path native/Cargo.toml --locked --offline
      - name: Test native crate
        run: cargo test --manifest-path native/Cargo.toml --locked --offline
      - name: Test Python to Rust projection seam
        env:
          ATHENA_NATIVE_BINARY: native/target/debug/athena-terminal
        run: uv run --extra dev pytest -q tests/e2e/test_native_projection_bridge.py

  # This lane is intentionally protected: it needs a real X11/WM environment
  # for the desktop acceptance suite. Hermes is an optional integration and
  # is certified by a separate job below. Python 3.12 also runs the complete
  # suite on every PR; 3.13 remains the default ordinary CI interpreter.
  core-release-certification:
    # workflow_dispatch runs the identical certification chain against a
    # candidate branch (defer-signing, no publishing); push runs remain the
    # authoritative post-merge qualification.  Pushes to the candidate
    # integration branch also certify pre-merge when dispatch rights are not
    # available to the automation identity.  This is a nonpublishing
    # qualification path: every privileged job below keeps its push-to-main/
    # tag gate, so signing and publication stay unreachable from a candidate.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/candidate/next-release' ||
      github.ref == 'refs/heads/fix/pr6-safe-main-integration'))
    # Keep release builds on the GLIBC-compatible baseline used by the native
    # artifact policy; Ubuntu 24.04 emits newer imported symbols.
    runs-on: ubuntu-22.04
    environment: core-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Install protected desktop dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap libx11-dev libxft-dev libgl1-mesa-dev \
            imagemagick xdotool xvfb openbox xclip x11-utils python3-xlib ripgrep

          # Bubblewrap needs unprivileged user namespaces.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          # Ubuntu 24.04+ AppArmor otherwise blocks Bubblewrap's network setup.
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          command -v bwrap
          bwrap --version
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-pid \
            --unshare-net \
            --proc /proc \
            --dev /dev \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            /usr/bin/true
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4
      - name: Check cosign
        run: cosign version
      - name: Record runner identity
        run: |
          mkdir -p "$RUNNER_TEMP/athena-release-evidence"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            cat /etc/os-release
          } > "$RUNNER_TEMP/athena-release-evidence/runner-identity.txt"
      - name: Bootstrap locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Run protected release checks
        env:
          PYTHONUNBUFFERED: "1"
          ATHENA_COSIGN: cosign
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -ac' \
            bash -ceu '
              openbox --replace >/tmp/athena-openbox.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              scripts/release-check \
                --sha "$GITHUB_SHA" \
                --bootstrap \
                --defer-signing \
                --evidence-dir "$RUNNER_TEMP/athena-release-evidence"
            '
      - name: Capture visual-golden candidates and per-fixture RMSE (owner evidence, nonpublishing)
        if: always()
        # Evidence-only companion to verify mode.  Captures the 45 mandatory
        # fixtures plus the physical cabinet from THIS candidate commit into
        # RUNNER_TEMP (never the checked-in golden assets), then compares each
        # capture against the committed approved goldens and prints the full
        # per-fixture RMSE table.  Nothing is approved or regenerated in the
        # repository; golden review status stays an owner decision.
        continue-on-error: true
        env:
          NATIVE_VISUAL_UPDATE_GOLDENS: "1"
          NATIVE_VISUAL_GOLDEN_DIR: "${{ runner.temp }}/athena-visual-candidates"
          NATIVE_CABINET_UPDATE_GOLDEN: "1"
          NATIVE_CABINET_GOLDEN: "${{ runner.temp }}/athena-visual-candidates/cabinet-golden.png"
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/athena-visual-candidates"
          rm -rf "$candidate_dir"
          mkdir -p "$candidate_dir"
          cp native/assets/oi/visual-goldens/manifest.json "$candidate_dir/manifest.json"
          xvfb-run -a -s '-screen 0 1920x1080x24 -ac' \
            bash -ceu '
              openbox --replace >/tmp/athena-openbox-capture.log 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              sleep 1
              scripts/native-visual-smoke || true
            '
          GOLDEN_DIR="${RUNNER_TEMP}/athena-visual-candidates" \
            python3 scripts/compare-visual-goldens.py

      - name: Upload candidate visual-capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athena-visual-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/athena-visual-candidates
      - name: Upload certified release artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athena-release-core-${{ github.sha }}
          path: ${{ runner.temp }}/athena-release-evidence

  release-signer:
    # Only this minimal job receives OIDC signing authority. It consumes the
    # frozen evidence payload; it does not build, test, or execute the release.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')) &&
      needs.core-release-certification.result == 'success'
    needs: [core-release-certification]
    runs-on: ubuntu-24.04
    environment: core-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4
      - name: Download unsigned certified evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: athena-release-core-${{ github.sha }}
          path: release-evidence
      - name: Sign the complete certification payload
        env:
          ATHENA_COSIGN: cosign
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          root="release-evidence/$GITHUB_SHA/$GITHUB_RUN_ID"
          scripts/sign-release-provenance \
            "$root/release-provenance.json" \
            "$root/release-provenance.sig"
          python scripts/create-certification-manifest \
            --evidence-dir "$root" \
            --source-sha "$GITHUB_SHA" \
            --release-run-id "$GITHUB_RUN_ID" \
            --output "$root/release-certification-manifest.json"
          scripts/sign-release-provenance \
            "$root/release-certification-manifest.json" \
            "$root/release-certification.sig"
      - name: Upload signed certification payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athena-release-signed-${{ github.sha }}
          path: release-evidence

  # Hermes is an optional read-only self-host supervision integration. Its
  # live evidence is opt-in and is never a prerequisite for core publication.
  hermes-referee-transport-certification:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')) &&
      needs.core-release-certification.result == 'success' &&
      vars.ATHENA_HERMES_E2E_ENABLED == 'true'
    needs: [core-release-certification]
    runs-on: ubuntu-24.04
    environment: hermes-integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Run optional Hermes referee certification
        env:
          ATHENA_HERMES_E2E_ENDPOINT: ${{ secrets.ATHENA_HERMES_E2E_ENDPOINT }}
          ATHENA_HERMES_E2E_API_KEY: ${{ secrets.ATHENA_HERMES_E2E_API_KEY }}
          ATHENA_HERMES_E2E_PROFILE: >-
            ${{ vars.ATHENA_HERMES_E2E_PROFILE || 'athena-referee' }}
          ATHENA_HERMES_INTEGRATION_GATE: "1"
          ATHENA_HERMES_E2E_EVIDENCE_PATH: >-
            ${{ runner.temp }}/athena-hermes-referee-certification.json
          ATHENA_RELEASE_SHA: ${{ github.sha }}
          ATHENA_RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          uv run --frozen --extra dev pytest -q -p no:cacheprovider \
            tests/e2e/test_hermes_agent.py \
            | tee "$RUNNER_TEMP/athena-hermes-referee-certification.txt"
      - name: Upload optional Hermes evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: athena-hermes-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/athena-hermes-referee-certification.txt
            ${{ runner.temp }}/athena-hermes-referee-certification.json

  verify-release:
    # Verification is deliberately separate from the OIDC publisher. It may
    # execute repository verification code, but it has no publish identity.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.release-signer.result == 'success'
    needs: [release-signer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4
      - name: Check cosign
        run: cosign version
      - name: Download protected certified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: athena-release-signed-${{ github.sha }}
          path: release-evidence
      - name: Verify certified identity, manifest, and hashes
        env:
          ATHENA_COSIGN: cosign
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          root="release-evidence/$GITHUB_SHA/$GITHUB_RUN_ID"
          python scripts/verify-release-provenance \
            "$root/release-provenance.json" \
            "$root/release-provenance.sig" \
            --certificate "$root/release-provenance.crt" \
            --metadata "$root/release-provenance-verification.json"
          python scripts/verify-release-provenance \
            "$root/release-certification-manifest.json" \
            "$root/release-certification.sig" \
            --certificate "$root/release-certification.crt" \
            --metadata "$root/release-certification-verification.json"
          python scripts/verify-release-evidence \
            --evidence-dir release-evidence \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --tag "$GITHUB_REF_NAME"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athena-release-verified-${{ github.sha }}
          path: release-evidence/${{ github.sha }}/${{ github.run_id }}/distributions

  publish:
    # The OIDC publisher consumes only the distributions emitted by the
    # unprivileged verification job. It never checks out or executes repo code.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.verify-release.result == 'success'
    needs: [verify-release]
    runs-on: ubuntu-24.04
    environment: pypi-production
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: athena-release-verified-${{ github.sha }}
          path: verified-distributions
      - name: Publish exact certified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: verified-distributions
          skip-existing: false
