[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-agent"
version = "0.1.0"
description = "Compact, local-first autonomous agent runtime with durable knowledge, structured delegation, universal execution, open capability protocols, and a single authoritative reasoning loop."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Athena Contributors" }]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "starlette>=0.38,<1.0",
    "click>=8.1",
    "uvicorn>=0.30",
    "pexpect>=4.9",
    "pyte>=0.8,<1",
    "jsonschema>=4.23,<5",
    "tomli-w>=1.0",
    "tomli>=2.0",
    "wcwidth>=0.2",
]

[project.optional-dependencies]
api = []
mcp = ["mcp>=1.0"]
anthropic = ["anthropic>=0.39"]
container = ["docker>=7.0"]
debug = ["debugpy>=1.8"]
cli = ["wcwidth>=0.2"]
glass = ["Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.11",
    "build>=1.2",
    "starlette>=0.38,<1.0",
    "uvicorn>=0.30",
    "click>=8.1",
]

[project.scripts]
athena = "athena.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athena = ["state/migrations/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep the merge gate focused on correctness and undefined-name regressions.
# Broader opinionated rules can be enabled incrementally after the existing
# codebase is mechanically normalized.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["PIL", "anthropic"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "athena_claim(*claim_ids): normative claim ids this test proves",
  "athena_evidence(*kinds): evidence classes this test produces (test, invariant, security, e2e)",
  "dsh_release: installed-artifact release acceptance lane",
]
